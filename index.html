<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GD Pattern Trainer</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --line:#2c2f35; --text:#e6e6e6; --dim:#8a8f98; --accent:#f2c94c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { display:flex; align-items:baseline; gap:16px; padding:14px 16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  h1 b { color:var(--accent); }
  #status { color:var(--dim); font-family:ui-monospace, monospace; }
  canvas { display:block; width:100%; background:#0b0c0e; touch-action:none; }
  #lane { height:300px; }
  #overview { height:44px; border-top:1px solid var(--line); cursor:crosshair; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; padding:12px 16px; }
  fieldset { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0; }
  legend { color:var(--dim); font-size:12px; padding:0 4px; }
  button { background:#2a2d33; color:var(--text); border:1px solid #3a3e46; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { background:#353941; }
  button.primary { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  select { background:#0f1012; color:var(--text); border:1px solid #3a3e46; border-radius:4px; padding:3px 5px; font:inherit; }
  input[type=number] { width:64px; background:#0f1012; color:var(--text); border:1px solid #3a3e46; border-radius:4px; padding:3px 5px; font:inherit; }
  #stats { padding:0 16px 8px; font-family:ui-monospace, monospace; white-space:pre-wrap; color:var(--dim); }
  #stats b { color:var(--text); }
  .help { padding:0 16px 24px; color:var(--dim); font-size:13px; }
  kbd { background:#2a2d33; border:1px solid #3a3e46; border-radius:3px; padding:0 4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>GD <b>Pattern</b> Trainer</h1>
  <span id="status">대기</span>
</header>
<canvas id="lane"></canvas>
<canvas id="overview"></canvas>

<div class="controls">
  <fieldset><legend>녹화</legend>
    속도 <input id="recSpeed" type="number" value="1" step="0.05" min="0.05" max="4">x
    <button id="btnRec" class="primary">전체 녹화 <kbd>R</kbd></button>
    <button id="btnReRec">구간 재녹화 <kbd>T</kbd></button>
    <button id="btnUndo">되돌리기</button>
  </fieldset>
  <fieldset><legend>연습 · 재생</legend>
    속도 <input id="playSpeed" type="number" value="1" step="0.05" min="0.05" max="4">x
    <span id="presets"><button>0.25</button><button>0.5</button><button>0.75</button><button>1</button></span>
    <label><input type="checkbox" id="loop" checked> 반복</label>
    <label><input type="checkbox" id="guide" checked> 가이드 소리</label>
    <label><input type="checkbox" id="hitsound"> 입력 소리</label>
    <label title="첫 클릭 순간을 첫 노트로 맞춤 (GD와 같이 칠 때)"><input type="checkbox" id="sync" checked> 첫 클릭 동기화</label>
    <button id="btnPlay" class="primary">연습 <kbd>P</kbd></button>
    <button id="btnReplay">리플레이 <kbd>V</kbd></button>
    <button id="btnAuto">매크로 재생 <kbd>A</kbd></button>
    <button id="btnGd" title="helper가 GD에 Space를 대신 누름. 첫 노트는 직접 누르면 나머지를 이어서 침">GD로 매크로 <kbd>G</kbd> <kbd>F11</kbd></button>
    <button id="btnStop">정지 <kbd>Esc</kbd></button>
  </fieldset>
  <fieldset><legend>설정</legend>
    보기 <select id="view"><option value="gd">GD (가로)</option><option value="rhythm">리듬게임 (세로)</option></select>
    줌 <input id="zoom" type="range" min="0.05" max="1.5" step="0.01" value="0.35">
    판정창 ± <input id="win" type="number" value="120" min="10" max="500">ms
    <label title="GD에서 R(재시작) 누른 순간 = 0초. 녹화·연습·GD 매크로 기준 통일"><input type="checkbox" id="rsync" checked> R 리스폰 동기화</label>
    <button id="btnSave">파일 저장</button>
    <button id="btnLoad">불러오기</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </fieldset>
</div>
<div id="stats"></div>
<canvas id="drift" style="height:160px; display:none" title="노트 시간(가로) vs 누름 오차(세로). 기울어진 선 = 갈수록 밀림"></canvas>
<p class="help">
  입력: <kbd>Space</kbd> <kbd>↑</kbd> <kbd>W</kbd> (누르고 있으면 홀드, 마우스 클릭은 무시).
  하단 바: <b>드래그</b> = 구간 선택(연습 / 재녹화 대상), <b>클릭</b> = 시작 위치 이동 + 구간 해제. 레인 위 휠 = 스크롤.<br>
  녹화 속도 0.2x로 녹화하면 실제 패턴은 5배 빠르게 저장됨 → 연습 속도 1x로 원래 속도 연습.
  구간 재녹화는 구간 앞 1.5초부터 기존 패턴(가이드 소리)을 들려준 뒤 구간 안의 입력만 교체.
</p>

<script>
const $ = id => document.getElementById(id);
const lane = $('lane'), ov = $('overview');
const lc = lane.getContext('2d'), oc = ov.getContext('2d');

const LEAD = 1500;   // real ms of run-up before a run starts
const HOLD = 60;     // pattern ms: notes held longer than this get release judgement

let notes = load();  // [{t, d}] in pattern ms at 1x, sorted by t
let backup = null;   // one-level undo
let sel = null;      // {a, b} selected range (pattern ms)
let cursor = 0;      // idle view position / practice start without a range
let mode = 'idle';   // idle | record | rerecord | practice | replay
let run = null;
let inputs = [], res = {}, held = null, lastOff = null;
let lastAttempt = null, history = [], recent = [];
let judge = null; // { off: ms | null (miss), at } latest judgement, drawn as PERFECT/GREAT/… in the rhythm view
const setJudge = off => { judge = { off, at: performance.now() }; };

function load() {
  try {
    const n = JSON.parse(localStorage.getItem('gdpt-notes'));
    return valid(n) ? n : [];
  } catch { return []; }
}
function persist() {
  res = {}; lastAttempt = null; // results are keyed by note index, stale once notes change
  try { localStorage.setItem('gdpt-notes', JSON.stringify(notes)); } catch {} }
function valid(n) { return Array.isArray(n) && n.every(x => Number.isFinite(x?.t) && Number.isFinite(x?.d)); }
const patLen = () => notes.reduce((m, n) => Math.max(m, n.t + n.d), 0) + 500;
const viewLen = () => patLen() + 2000; // room to append via re-record
const pt = now => run.startPt + (now - run.startReal) * run.speed;
const speedOf = id => Math.min(4, Math.max(0.05, +$(id).value || 1));
const win = () => +$('win').value || 120;

// ---------- audio ----------
let ac = null;
function ensureAudio() { ac ??= new AudioContext(); ac.resume(); }
// browsers only allow audio after a real click/key in the page; runs started from GD hotkeys (F6–F11)
// aren't one, so unlock on the first interaction and keep it for the session
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, ensureAudio, { capture: true });
function beep(freq, delaySec = 0) {
  if (!ac) return;
  const t = ac.currentTime + Math.max(0, delaySec);
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.start(t); o.stop(t + 0.06);
}

// ---------- runs ----------
function start(kind) {
  stop();
  if (kind !== 'record' && !notes.length) return alert('먼저 패턴을 녹화하세요');
  if (kind === 'rerecord' && !sel) return alert('하단 바를 드래그해서 재녹화할 구간을 선택하세요');
  if (kind === 'replay' && !lastAttempt) return alert('리플레이할 연습 기록이 없습니다');
  ensureAudio();
  let speed, from, to, guide = [];
  if (kind === 'record') {
    backup = notes; notes = [];
    speed = speedOf('recSpeed'); from = 0; to = Infinity;
  } else if (kind === 'rerecord') {
    backup = notes;
    speed = speedOf('recSpeed'); ({ a: from, b: to } = sel);
    notes = notes.filter(n => n.t < from || n.t >= to);
    guide = notes.slice();
  } else if (kind === 'practice' || kind === 'auto') {
    speed = speedOf('playSpeed');
    from = sel ? sel.a : cursor; to = sel ? sel.b : patLen();
    guide = kind === 'auto' || $('guide').checked ? notes : [];
  } else {
    ({ from, to } = lastAttempt);
    speed = speedOf('playSpeed');
    guide = lastAttempt.inputs; // hear your own clicks
  }
  // run ends after the last hold that starts inside the range is released
  let end = to;
  for (const n of notes) if (n.t >= from && n.t < to) end = Math.max(end, n.t + n.d);
  mode = kind;
  const first = notes.find(n => n.t >= from && n.t < to)?.t;
  run = { speed, from, to, end: end + 300 * speed, guide, gi: 0, first, base: notes.slice(),
    // R-sync only when driven from GD (helper connected, page not focused); started in the page = site-only run
    rOrigin: rsync() && helperOn && !document.hasFocus() && R_MODES.includes(kind) };
  reset(performance.now());
}
function reset(now) {
  run.startReal = now + LEAD;
  run.startPt = run.from;
  run.gi = 0;
  run.waitR = run.rOrigin;
  run.wait = !run.waitR && mode === 'practice' && $('sync').checked && run.first != null;
  if (mode === 'practice') { inputs = []; res = {}; lastOff = null; recent = []; }
}
// R-sync: pressing R in GD (restart) is time zero for record / re-record / practice,
// so recordings, practice and the GD macro all share the level start as their origin.
const R_MODES = ['record', 'rerecord', 'practice'];
const rsync = () => $('rsync').checked;
function onRestart(time) {
  if (!run || !run.rOrigin) return;
  if (mode === 'practice' && !run.waitR) finishAttempt();
  held = null; downKeys.clear();
  if (mode === 'practice') { inputs = []; res = {}; lastOff = null; recent = []; }
  else notes = run.base.slice(); // died and restarted: drop this take
  run.waitR = run.wait = false;
  run.startPt = 0; run.startReal = time; run.gi = 0;
}
function stop() {
  if (!run) return;
  if (held) release(performance.now());
  if (mode === 'record' && notes.length && !run.rOrigin) { // trim leading silence to 500ms
    const shift = notes[0].t - 500;
    notes.forEach(n => n.t -= shift);
  }
  if (mode === 'record' || mode === 'rerecord') {
    notes.sort((a, b) => a.t - b.t);
    if (!notes.length) notes = backup ?? [];
    persist();
  }
  if (mode === 'practice') finishAttempt();
  run = null; mode = 'idle';
}
const targets = () => notes.map((n, i) => i).filter(i => notes[i].t >= run.from && notes[i].t < run.to);

// drift graph: press error vs note time with a least-squares line.
// flat line + wide scatter = random (frames / hands); sloped line = timing slowly slides (clock / GD lag).
function drawDrift(pts) {
  const c = $('drift');
  if (pts.length < 4) { c.style.display = 'none'; return ''; }
  c.style.display = 'block';
  const [w, h] = fit(c), g = c.getContext('2d');
  const n = pts.length, mx = pts.reduce((s, p) => s + p[0], 0) / n, my = pts.reduce((s, p) => s + p[1], 0) / n;
  const sxx = pts.reduce((s, p) => s + (p[0] - mx) ** 2, 0);
  const slope = sxx ? pts.reduce((s, p) => s + (p[0] - mx) * (p[1] - my), 0) / sxx : 0; // ms of error per ms of level
  const t0 = pts[0][0], t1 = pts[n - 1][0] || t0 + 1, Y = Math.max(30, ...pts.map(p => Math.abs(p[1])));
  const X = t => 70 + (t - t0) / (t1 - t0 || 1) * (w - 86), Yp = o => h / 2 - o / Y * (h / 2 - 12);
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#2c2f35'; g.fillRect(70, h / 2, w - 86, 1);
  g.fillStyle = '#8a8f98'; g.font = '11px system-ui'; g.textAlign = 'right';
  g.fillText(`늦음 +${Y.toFixed(0)}`, 64, 16); g.fillText("0", 64, h / 2 + 4); g.fillText(`빠름 -${Y.toFixed(0)}`, 64, h - 6);
  for (const [t, o] of pts) { g.fillStyle = colOff(o); g.fillRect(X(t) - 2, Yp(o) - 2, 4, 4); }
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath();
  g.moveTo(X(t0), Yp(my + slope * (t0 - mx))); g.lineTo(X(t1), Yp(my + slope * (t1 - mx))); g.stroke();
  const per10s = slope * 10000;
  return `${per10s >= 0 ? '+' : ''}${per10s.toFixed(1)}ms/10초 (평균 ${my >= 0 ? '+' : ''}${my.toFixed(1)})`;
}

function finishAttempt() {
  if (!inputs.length) return;
  const idx = targets();
  const hits = idx.filter(i => res[i] && !res[i].miss).map(i => res[i].press);
  const rel = idx.filter(i => res[i]?.release != null).map(i => res[i].release);
  lastAttempt = { inputs, res, from: run.from, to: run.to, speed: run.speed };
  const s = a => {
    if (!a.length) return '-';
    const m = a.reduce((x, y) => x + y, 0) / a.length;
    const sd = Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / a.length);
    return `평균 ${m >= 0 ? '+' : ''}${m.toFixed(1)}ms  편차 ${sd.toFixed(1)}ms`;
  };
  const extra = inputs.length - hits.length;
  history.unshift(`${run.speed}x  히트 <b>${hits.length}/${idx.length}</b>  빈클릭 ${extra}  | 누름 ${s(hits)} | 뗌 ${s(rel)}`);
  history.length = Math.min(history.length, 8);
  const trend = drawDrift(idx.filter(i => res[i]?.press != null).map(i => [notes[i].t, res[i].press]));
  if (trend) history[0] += `  | 추세 ${trend}`;
  $('stats').innerHTML = history.join('\n');
}

// ---------- input ----------
function press(time) {
  if (held || !run || run.waitR || mode === 'replay' || mode === 'auto') return;
  if (run.wait) { // first-click sync: your first click defines where the first note is
    run.wait = false;
    run.startReal = time - (run.first - run.startPt) / run.speed;
  }
  const t = pt(time);
  if (mode === 'gd') { held = { t, d: 0, user: true }; inputs.push(held); return; }
  if ($('hitsound').checked) beep(880);
  if (mode === 'record' || mode === 'rerecord') {
    if (t < run.from || t >= run.to) return;
    held = { t, d: 0 }; notes.push(held);
  } else {
    held = { t, d: 0 }; inputs.push(held);
    const W = win() * run.speed;
    let best = -1, bd = Infinity;
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      if (res[i] || n.t < run.from || n.t >= run.to) continue;
      const dd = Math.abs(t - n.t);
      if (dd < bd) { bd = dd; best = i; }
    }
    if (best >= 0 && bd <= W) {
      held.note = best;
      lastOff = (t - notes[best].t) / run.speed;
      setJudge(lastOff);
      recent.push(lastOff);
      res[best] = { press: lastOff };
    }
  }
}
function release(time) {
  const h = held; held = null;
  if (!h || !run) return;
  h.d = Math.max(0, Math.min(pt(time), run.to) - h.t);
  if (mode === 'practice' && h.note != null) {
    const n = notes[h.note];
    if (n.d >= HOLD) res[h.note].release = (h.t + h.d - n.t - n.d) / run.speed;
  }
}

// all GD jump inputs act as one button (single player): pressed while any is down
const KEYS = new Set(['Space', 'ArrowUp', 'KeyW']);
const downKeys = new Set();
function jump(id, isDown, time) {
  if (isDown) { if (!downKeys.has(id)) { downKeys.add(id); if (downKeys.size === 1) press(time); } }
  else if (downKeys.delete(id) && downKeys.size === 0) release(time);
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range') return;
  if (KEYS.has(e.code)) { e.preventDefault(); jump(e.code, true, e.timeStamp); return; }
  if (e.repeat) return;
  const act = { KeyR: () => start('record'), KeyT: () => start('rerecord'), KeyP: () => start('practice'), KeyV: () => start('replay'), KeyA: () => start('auto'), KeyG: sendToGd, Escape: () => { stopGd(); stop(); } }[e.code];
  if (act) { e.preventDefault(); act(); }
});
addEventListener('keyup', e => { if (KEYS.has(e.code)) { e.preventDefault(); jump(e.code, false, e.timeStamp); } });

// global input from gdpt-helper.exe, used only while this page is NOT focused (e.g. playing GD)
let helperOn = false, hOff = Infinity;
try {
  const es = new EventSource('/events');
  es.onopen = () => { helperOn = true; };
  es.onerror = () => { helperOn = false; if (hOff === Infinity) es.close(); }; // no helper here: stop retrying
  es.onmessage = e => {
    const [k, v] = e.data.split(',');
    if (k === 'm') return gdState(v, e.data.split(',').slice(2).join(','));
    if (k === 's') return gdSent(e.data.split(','));
    if ('dupr'.includes(k)) {
      // ponytail: min-latency offset between helper clock and performance.now, fine unless clocks drift over hours
      hOff = Math.min(hOff, performance.now() - +v);
    }
    if (k === 'p' || document.hasFocus()) return;
    if (k === 'd') jump('helper', true, +v + hOff);
    else if (k === 'u') jump('helper', false, +v + hOff);
    else if (k === 'r') onRestart(+v + hOff);
    else if (k === 'k') v === 'stop' ? stop() : v === 'gd' ? sendToGd() : start(v);
  };
} catch {}

// macro into GD: the helper presses Space for you. You press the first note yourself
// (that aligns the pattern with the level), the helper plays every note after it at 1x.
let gdMacro = null;
let gdSend = null, gdFg = '', gdWorst = 0;
// helper reports: playing,<t0> (time zero) · fg,<window title> · done / stopped
function gdState(v, arg) {
  if (v === 'fg') { gdFg = arg; return; }
  gdMacro = v;
  if (v === 'playing' && gdSend) {
    stop();
    mode = 'gd'; gdWorst = 0;
    inputs = []; res = {}; lastOff = null; recent = [];
    const { origin, list, speed } = gdSend, last = list[list.length - 1];
    run = { speed, from: origin, to: last.t + 1, end: Infinity, guide: [], gi: 0, base: [],
            startPt: origin, startReal: +arg + hOff };
  }
  if ((v === 'done' || v === 'stopped') && mode === 'gd') {
    lastAttempt = { inputs, res, from: run.from, to: run.to, speed: run.speed }; // V replays what the bot did
    setTimeout(() => { if (mode === 'gd') stop(); }, 800); // leave the cursor alone: A / P must still start where you set it
  }
}
// helper sent a key: s,<vk>,<down 1|0>,<helper time>,<lateness ms>
let botHeld = null;
function gdSent([, vk, down, t, late]) {
  if (mode !== 'gd' || vk !== '32') return; // R is time zero, already known
  gdWorst = Math.max(gdWorst, +late);
  const pt_ = pt(+t + hOff);
  if (down === '1') {
    botHeld = { t: pt_, d: 0, bot: true }; inputs.push(botHeld);
    let best = -1, bd = Infinity;
    notes.forEach((n, i) => { const dd = Math.abs(pt_ - n.t); if (!res[i] && dd < bd) { bd = dd; best = i; } });
    if (best >= 0 && bd <= win() * run.speed) { botHeld.note = best; res[best] = { press: lastOff = (pt_ - notes[best].t) / run.speed }; recent.push(lastOff); setJudge(lastOff); }
  } else if (botHeld) { botHeld.d = pt_ - botHeld.t; botHeld = null; }
}

async function sendToGd() {
  if (!helperOn) return alert('gdpt-helper.exe를 실행하고 http://localhost:8123 으로 열어야 합니다');
  // R-sync: helper presses R itself and plays from the level start (up to the end of the range)
  const r = rsync();
  const list = notes.filter(n => r ? n.t < (sel ? sel.b : Infinity) : sel ? n.t >= sel.a && n.t < sel.b : n.t >= cursor);
  if (!list.length) return alert('보낼 노트가 없습니다');
  stop();
  const t0 = r ? 0 : list[0].t;
  // macro speed = 연습·재생 속도. Below 1x GD must be slowed the same amount (speedhack), or it will fail.
  const speed = speedOf('playSpeed');
  gdSend = { origin: t0, list, speed };
  const body = list.map(n => `${((n.t - t0) / speed).toFixed(3)},${(n.d / speed).toFixed(3)}`).join('\n');
  try { await fetch(r ? '/macro?r=1' : '/macro', { method: 'POST', body }); } catch { alert('helper 연결 실패'); }
}
function stopGd() { if (helperOn && (gdMacro === 'armed' || gdMacro === 'playing')) fetch('/macro/stop', { method: 'POST' }).catch(() => {}); }
lane.addEventListener('wheel', e => {
  if (run) return;
  e.preventDefault();
  cursor = Math.min(viewLen(), Math.max(0, cursor + e.deltaY / +$('zoom').value * 0.5));
}, { passive: false });
addEventListener('blur', () => { downKeys.clear(); release(performance.now()); });

// overview: drag = select range, click = move cursor
let drag = null;
const xToT = x => Math.min(viewLen(), Math.max(0, x / ov.clientWidth * viewLen()));
ov.addEventListener('pointerdown', e => { if (run) return; drag = e.offsetX; ov.setPointerCapture(e.pointerId); });
ov.addEventListener('pointermove', e => {
  if (drag == null || Math.abs(e.offsetX - drag) <= 4) return;
  sel = { a: xToT(Math.min(drag, e.offsetX)), b: xToT(Math.max(drag, e.offsetX)) };
});
ov.addEventListener('pointerup', e => {
  if (drag != null && Math.abs(e.offsetX - drag) <= 4) { cursor = xToT(e.offsetX); sel = null; }
  drag = null;
});

// buttons (blur so Space never re-triggers them)
const on = (id, fn) => $(id).addEventListener('click', e => { e.currentTarget.blur(); fn(); });
on('btnRec', () => start('record'));
on('btnReRec', () => start('rerecord'));
on('btnPlay', () => start('practice'));
on('btnReplay', () => start('replay'));
on('btnAuto', () => start('auto'));
on('btnGd', sendToGd);
on('btnStop', () => { stopGd(); stop(); });
// speed change applies live to a running practice / playback / replay
function setSpeed() {
  if (!run || !['practice', 'auto', 'replay'].includes(mode)) return;
  const now = performance.now();
  if (!run.wait && now > run.startReal) { run.startPt = pt(now); run.startReal = now; }
  run.speed = speedOf('playSpeed');
}
$('playSpeed').addEventListener('input', setSpeed);
$('presets').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  e.target.blur(); $('playSpeed').value = e.target.textContent; setSpeed();
});
on('btnUndo', () => { stop(); if (backup) { [notes, backup] = [backup, notes]; persist(); } });
on('btnSave', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ notes })], { type: 'application/json' }));
  a.download = 'pattern.json'; a.click(); URL.revokeObjectURL(a.href);
});
on('btnLoad', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const n = JSON.parse(await f.text()).notes;
    if (!valid(n)) throw 0;
    stop(); backup = notes; notes = n.sort((a, b) => a.t - b.t); sel = null; cursor = 0; persist();
  } catch { alert('패턴 파일이 아닙니다'); }
});

// ---------- loop ----------
function tick(now) {
  if (run.waitR) { run.startPt = 0; run.startReal = now; return; } // frozen at 0 until R
  if (run.wait) { // hold the view just before the first note until the first click
    run.startReal = now - (run.first - 300 * run.speed - run.startPt) / run.speed;
    return;
  }
  const p = pt(now);
  // schedule guide beeps slightly ahead on the audio clock (no frame jitter)
  const ahead = p + 150 * run.speed, g = run.guide;
  while (run.gi < g.length && g[run.gi].t < ahead) {
    const n = g[run.gi++];
    if (n.t < p - 5 || n.t < run.from - LEAD * run.speed) continue;
    if ($(mode === 'replay' ? 'hitsound' : 'guide').checked)
      beep(mode === 'replay' ? 660 : 1320, (run.startReal + (n.t - run.startPt) / run.speed - now) / 1000);
  }
  if (mode === 'practice' || mode === 'gd') {
    const W = win() * run.speed;
    for (const i of targets()) if (!res[i] && p > notes[i].t + W) { res[i] = { miss: true }; setJudge(null); }
  }
  if (mode === 'rerecord' && p >= run.to) return stop();
  if (mode !== 'record' && p >= run.end) {
    if (mode === 'practice') finishAttempt();
    if ((mode === 'practice' || mode === 'auto') && $('loop').checked) return reset(now);
    stop();
  }
}

// error colour: 0ms green → 30ms yellow → 60ms+ red, so the size of a miss reads at a glance
const ERR_RED = 60;
const colOff = o => `hsl(${130 * (1 - Math.min(1, Math.abs(o) / ERR_RED))}, 80%, 58%)`;
// hold-length colour: short tap red → long hold yellow (log scale, 30ms..600ms)
const colLen = d => `hsl(${55 * Math.min(1, Math.max(0, Math.log(d / 30) / Math.log(20)))}, 90%, 55%)`;
const fmt = o => (o >= 0 ? '+' : '') + o.toFixed(1);

function fit(c) {
  const r = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * r) || c.height !== Math.round(h * r)) { c.width = Math.round(w * r); c.height = Math.round(h * r); }
  c.getContext('2d').setTransform(r, 0, 0, r, 0, 0);
  return [w, h];
}

function drawMeter(hx, my) {
  const half = 130, scale = half / win();
  for (let x = -half; x < half; x += 2) { lc.fillStyle = colOff(x / scale); lc.globalAlpha = 0.25; lc.fillRect(hx + x, my, 2, 6); }
  recent.slice(-20).forEach((o, k, a) => {
    lc.globalAlpha = 0.3 + 0.7 * (k + 1) / a.length;
    lc.fillStyle = colOff(o); lc.fillRect(hx + Math.max(-half, Math.min(half, o * scale)) - 1.5, my - 8, 3, 22);
  });
  lc.globalAlpha = 1; lc.fillStyle = '#fff'; lc.fillRect(hx - 1, my - 10, 2, 26);
  lc.font = '11px system-ui'; lc.fillStyle = '#8a8f98';
  lc.textAlign = 'right'; lc.fillText('빠름', hx - half - 6, my + 7);
  lc.textAlign = 'left'; lc.fillText('늦음', hx + half + 6, my + 7);
}

// status line under the lane / centre of the rhythm lane: countdown, waits, GD macro target window
function runMessage(p) {
  if (mode === 'gd') {
    const ok = /geometry ?dash/i.test(gdFg);
    return [ok ? `키 → ${gdFg}` : `⚠ 키가 GD가 아닌 "${gdFg || '알 수 없음'}" 창으로 가는 중`, ok ? '#4cd59a' : '#eb5757', 15];
  }
  if (run?.waitR) return ['R 대기 — GD에서 R을 눌러 재시작하면 시작', '#f2c94c', 16];
  if (run?.wait) return ['첫 클릭 대기 — 첫 노트 타이밍에 누르세요', '#f2c94c', 16];
  if (run && p < run.from) return [Math.ceil((run.from - p) / run.speed / 500) + '', '#f2c94c', 28];
  return null;
}

const TIERS = [[8, 'PERFECT', '#7df9ff'], [20, 'GREAT', '#4cd59a'], [45, 'GOOD', '#f2c94c'], [Infinity, 'BAD', '#f2994a']];

// rhythm-game view: notes fall down a lit lane onto a receptor diamond.
// tap = outlined diamond, hold = black capsule with a diamond at each end, judgement / combo in side panels.
function rrect(x, y, w, h, r) { lc.beginPath(); lc.roundRect(x, y, w, h, r); }
function diamond(x, y, r) { lc.beginPath(); lc.moveTo(x, y - r); lc.lineTo(x + r, y); lc.lineTo(x, y + r); lc.lineTo(x - r, y); lc.closePath(); }
// outlined diamond: black rim, coloured core
function gem(x, y, r, core) {
  diamond(x, y, r); lc.fillStyle = '#0b0b0d'; lc.fill();
  diamond(x, y, r * 0.55); lc.fillStyle = core; lc.fill();
}
// hold capsule: pointed top and bottom, flat sides
function capsule(x, yTop, yBot, r) {
  lc.beginPath();
  lc.moveTo(x, yTop - r); lc.lineTo(x + r, yTop); lc.lineTo(x + r, yBot); lc.lineTo(x, yBot + r);
  lc.lineTo(x - r, yBot); lc.lineTo(x - r, yTop); lc.closePath();
}
function drawRhythm(now, p, z, R, live) {
  const [w, h] = fit(lane);
  const lw = Math.min(240, w * 0.42), lx = (w - lw) / 2, cx = w / 2, jy = h - 120, zz = z * 1.6, G = 22;
  const side = lx, wide = side > 150;
  const Y = t => jy - (t - p) * zz;
  lc.clearRect(0, 0, w, h);

  const down = held || botHeld || (mode === 'auto' && notes.some(n => p >= n.t && p < n.t + Math.max(n.d, 40)));
  // lane: warm light rising toward the line, white glow just above it, white edges, thin centre rail
  const bg = lc.createLinearGradient(0, 0, 0, jy);
  bg.addColorStop(0, 'rgba(240,168,104,0.05)'); bg.addColorStop(0.75, 'rgba(240,168,104,0.22)'); bg.addColorStop(1, 'rgba(255,236,214,0.45)');
  lc.fillStyle = bg; lc.fillRect(lx, 0, lw, jy);
  if (down) { const g = lc.createLinearGradient(0, jy - 220, 0, jy); g.addColorStop(0, 'rgba(125,249,255,0)'); g.addColorStop(1, 'rgba(125,249,255,0.30)'); lc.fillStyle = g; lc.fillRect(lx, jy - 220, lw, 220); }
  lc.fillStyle = 'rgba(0,0,0,0.35)'; lc.fillRect(lx, jy, lw, h - jy); // below the line: darker
  lc.fillStyle = 'rgba(255,255,255,0.85)'; lc.fillRect(lx - 1, 0, 2, h); lc.fillRect(lx + lw - 1, 0, 2, h);
  lc.fillStyle = 'rgba(20,20,24,0.6)'; lc.fillRect(cx - 1, 0, 2, h);

  // 0.5s ticks on the left edge (time until the line)
  lc.font = '11px ui-monospace, monospace'; lc.textAlign = 'right';
  for (let k = Math.ceil(p / 500) * 500; Y(k) > 0; k += 500) {
    const y = Y(k); if (y > jy - 14) continue;
    lc.fillStyle = 'rgba(255,255,255,0.5)'; lc.fillRect(lx - 7, y, 6, 1);
    lc.fillStyle = '#5c616b'; lc.fillText(`${((k - p) / 1000).toFixed(1)}s`, lx - 10, y + 4);
  }

  const tTop = p + (jy + G) / zz, tBot = p - (h - jy) / zz;
  notes.forEach((n, i) => {
    const d = live(n), r = mode === 'auto' ? (p >= n.t ? {} : null) : R[i];
    if (n.t > tTop || n.t + d < tBot) return;
    const hit = r && !r.miss, holding = hit && (held?.note === i || botHeld?.note === i || mode === 'auto') && p < n.t + d;
    if (hit && p >= n.t && !holding) return; // cleared notes vanish
    const core = r?.miss ? '#6b6e76' : colLen(Math.max(d, 1)), yh = holding ? jy : Y(n.t);
    lc.globalAlpha = r?.miss ? 0.45 : 1;
    if (d >= HOLD) {
      const yt = Y(n.t + d);
      capsule(cx, yt, yh, G * 0.8); lc.fillStyle = '#0b0b0d'; lc.fill();
      diamond(cx, yt, G * 0.45); lc.fillStyle = core; lc.fill();           // release end
      if (!holding) { diamond(cx, yh, G * 0.45); lc.fillStyle = core; lc.fill(); } // press end
      if (yh - yt > 60) { lc.fillStyle = '#c9ccd2'; lc.font = '700 12px ui-monospace, monospace'; lc.textAlign = 'center'; lc.fillText(Math.round(d) + 'ms', cx, (yt + yh) / 2 + 4); }
    } else if (!holding) gem(cx, yh, G, core);
    lc.globalAlpha = 1;
    // gap since the previous press, beside the lane
    if (!holding && yh < jy - 4) {
      const gap = i > 0 ? n.t - notes[i - 1].t : null;
      lc.textAlign = 'left'; lc.font = '600 12px ui-monospace, monospace';
      lc.fillStyle = r?.miss ? '#eb5757' : '#8a8f98';
      lc.fillText(r?.miss ? 'MISS' : gap != null ? `+${Math.round(gap)}` : 'start', lx + lw + 10, yh + 4);
    }
  });

  // judgement line with the receptor diamond; lights up while pressed, flashes on a hit
  lc.fillStyle = '#fff'; lc.fillRect(lx, jy - 1, lw, 2);
  const flash = judge && judge.off != null && now - judge.at < 150;
  lc.save();
  if (down || flash) { lc.shadowColor = '#7df9ff'; lc.shadowBlur = 22; }
  diamond(cx, jy, 16); lc.fillStyle = down || flash ? '#7df9ff' : '#0b0b0d'; lc.fill();
  lc.lineWidth = 2; lc.strokeStyle = 'rgba(255,255,255,0.8)'; lc.stroke();
  lc.restore();

  // combo + latest judgement in side panels (or above the lane when narrow)
  let combo = 0;
  if (run && (mode === 'practice' || mode === 'gd')) for (const i of targets()) { if (!res[i]) break; combo = res[i].miss ? 0 : combo + 1; }
  const jx = wide ? lx / 2 : cx, jyText = wide ? jy - 60 : h * 0.22;
  const kx = wide ? lx + lw + side / 2 : cx, ky = wide ? jy - 70 : h * 0.12;
  lc.textAlign = 'center';
  if (combo > 1) {
    lc.fillStyle = '#e6e6e6'; lc.font = '800 46px system-ui'; lc.fillText(combo, kx, ky);
    lc.font = '700 12px system-ui'; lc.fillStyle = '#8a8f98'; lc.fillText('COMBO', kx, ky + 20);
  }
  if (judge && (mode === 'practice' || mode === 'gd')) {
    const age = (now - judge.at) / 600;
    if (age < 1) {
      const [, text, c] = judge.off == null ? [0, 'MISS', '#eb5757'] : TIERS.find(t => Math.abs(judge.off) <= t[0]);
      lc.globalAlpha = Math.min(1, 2 * (1 - age)); lc.fillStyle = c;
      lc.font = `900 ${Math.round(34 * (1 + 0.25 * Math.max(0, 0.15 - age) / 0.15))}px system-ui`;
      lc.fillText(text, jx, jyText);
      if (judge.off != null) {
        lc.font = '700 16px ui-monospace, monospace'; lc.fillText(`${fmt(judge.off)} ms`, jx, jyText + 26);
        if (Math.abs(judge.off) >= 3) { lc.font = '700 13px system-ui'; lc.fillText(judge.off < 0 ? '빠름' : '늦음', jx, jyText + 46); }
      }
      lc.globalAlpha = 1;
    }
  }
  if (mode === 'practice' || recent.length) drawMeter(cx, jy + 80);
  const msg = runMessage(p);
  if (msg) {
    lc.textAlign = 'center'; lc.font = `700 ${msg[2]}px system-ui`;
    const tw = lc.measureText(msg[0]).width;
    lc.fillStyle = 'rgba(11,12,14,0.85)'; rrect(cx - tw / 2 - 14, h * 0.42 - msg[2], tw + 28, msg[2] + 18, 8); lc.fill();
    lc.fillStyle = msg[1]; lc.fillText(msg[0], cx, h * 0.42);
  }
}

function draw(now) {
  const p = run ? pt(now) : cursor;
  const z = +$('zoom').value;
  const R = mode === 'replay' ? lastAttempt.res : res;
  const I = mode === 'replay' ? lastAttempt.inputs : mode === 'practice' || mode === 'gd' ? inputs : mode === 'auto' ? notes.filter(n => n.t <= p) : [];
  const live = x => x === held ? Math.max(0, p - x.t) : x.d;

  if ($('view').value === 'rhythm') drawRhythm(now, p, z, R, live); else {
  // lane
  const [w, h] = fit(lane);
  const hx = Math.min(w * 0.3, 360), ly = 70, lh = 110;
  const X = t => hx + (t - p) * z;
  lc.clearRect(0, 0, w, h);
  lc.fillStyle = '#15171a'; lc.fillRect(0, ly, w, lh);
  if (run || sel) { // dim outside active range
    const a = run ? run.from : sel.a, b = run ? run.to : sel.b;
    lc.fillStyle = 'rgba(242,201,76,0.06)';
    lc.fillRect(X(a), ly, Math.min(w, X(b)) - X(a), lh);
  }
  const t0 = p - hx / z, t1 = p + (w - hx) / z;
  lc.font = '700 15px ui-monospace, monospace'; lc.textAlign = 'center';
  notes.forEach((n, i) => {
    const d = live(n);
    if (n.t + d < t0 || n.t > t1) return;
    const r = mode === 'auto' ? (p >= n.t ? {} : null) : R[i], x0 = X(n.t), x1 = X(n.t + d), cy = ly + lh / 2;
    const col = r?.miss ? '#555' : colLen(Math.max(d, 1));
    // body: bar from press to release (min width so taps stay visible), end cap marks the release
    lc.globalAlpha = r?.miss ? 0.5 : 0.7; lc.fillStyle = col;
    lc.fillRect(x0, cy - 24, Math.max(10, x1 - x0), 48);
    lc.globalAlpha = 1;
    if (d >= HOLD) lc.fillRect(x1 - 3, cy - 30, 6, 60);
    // start = one sharp vertical line exactly at the press time, full lane height, with a ▼ on top.
    // white until judged, then the error colour.
    const head = r?.miss ? '#777' : r?.press != null ? colOff(r.press) : '#fff';
    lc.fillStyle = head;
    lc.fillRect(x0 - 2, ly + 4, 4, lh - 8);
    lc.beginPath(); lc.moveTo(x0 - 9, ly - 4); lc.lineTo(x0 + 9, ly - 4); lc.lineTo(x0, ly + 8); lc.fill();
    if (x1 - x0 > 70) { lc.fillStyle = '#111'; lc.fillText(Math.round(d) + 'ms', (x0 + x1) / 2, cy + 5); }
    if (r?.press != null) {
      lc.fillStyle = colOff(r.press); lc.fillText(fmt(r.press), x0, ly - 12);
      if (r.release != null) { lc.fillStyle = colOff(r.release); lc.fillText('↑' + fmt(r.release), x1, ly - 12); }
    } else if (r?.miss) { lc.fillStyle = '#eb5757'; lc.fillText('MISS', x0, ly - 12); }
  });
  // player inputs
  for (const x of I) {
    const a = X(x.t), b = X(x.t + live(x));
    if (b < 0 || a > w) continue;
    lc.fillStyle = x.user ? '#eb5757' : x.note != null ? '#d0d0d0' : '#777';
    lc.fillRect(a, ly + lh + 12, Math.max(3, b - a), 14);
  }
  // macro playback: jump button lights while the bot is holding
  if (mode === 'auto' && notes.some(n => p >= n.t && p < n.t + Math.max(n.d, 40))) {
    lc.fillStyle = '#4cd59a'; lc.fillRect(hx - 22, ly + lh + 32, 44, 16);
  }
  // hit line + readouts
  lc.fillStyle = '#fff'; lc.fillRect(hx - 1, ly - 30, 2, lh + 50);
  lc.textAlign = 'left'; lc.font = '600 13px ui-monospace, monospace';
  if (lastOff != null && mode === 'practice') {
    lc.fillStyle = colOff(lastOff); lc.font = '700 18px ui-monospace, monospace';
    lc.fillText(fmt(lastOff) + ' ms ' + (Math.abs(lastOff) < 3 ? '' : lastOff < 0 ? '빠름' : '늦음'), hx + 8, ly - 30);
  }
  // hit-error meter: left = early, right = late, colour = how far off; latest hit brightest
  if (mode === 'practice' || recent.length) drawMeter(hx, ly + lh + 92);
  const msg = runMessage(p);
  if (msg) { lc.textAlign = 'left'; lc.fillStyle = msg[1]; lc.font = `700 ${msg[2]}px system-ui`; lc.fillText(msg[0], hx + 12, ly + lh + 64); }
  if (mode === 'gd' && inputs.some(x => x.user)) { lc.font = '700 15px system-ui'; lc.fillStyle = '#eb5757'; lc.fillText('⚠ 재생 중에 직접 누른 입력 있음 (빨간 바) — 봇 입력과 겹침', hx + 12, ly + lh + 84); }
  }

  // overview
  const [ow, oh] = fit(ov), L = viewLen(), OX = t => t / L * ow;
  oc.clearRect(0, 0, ow, oh);
  if (sel) { oc.fillStyle = 'rgba(242,201,76,0.18)'; oc.fillRect(OX(sel.a), 0, OX(sel.b) - OX(sel.a), oh); }
  for (const n of notes) { oc.fillStyle = colLen(Math.max(n.d, 1)); oc.fillRect(OX(n.t), oh * 0.3, Math.max(1, OX(n.d)), oh * 0.4); }
  oc.fillStyle = '#fff'; oc.fillRect(OX(p) - 1, 0, 2, oh);
  oc.fillStyle = '#555'; oc.fillRect(OX(patLen()), 0, 1, oh);

  const names = { idle: '대기', record: '녹화 중', rerecord: '구간 재녹화', practice: '연습', replay: '리플레이', auto: '매크로 재생', gd: 'GD 매크로 (실제 보낸 키)' };
  $('status').textContent = `${names[mode]}${run ? ' ' + run.speed + 'x' : ''} · ${(p / 1000).toFixed(2)}s · 노트 ${notes.length}개`
    + (sel ? ` · 구간 ${(sel.a / 1000).toFixed(2)}–${(sel.b / 1000).toFixed(2)}s` : '')
    + (mode === 'record' ? ' · Esc / F9로 종료' : '')
    + (helperOn ? ' · 전역 입력 ON' : '')
    + (ac?.state === 'running' ? '' : ' · 🔇 소리 잠김: 트레이너 페이지를 한 번 클릭하세요')
    + ({ starting: ' · GD 매크로: R 누르고 시작', armed: ' · GD 매크로 대기: GD에서 첫 노트를 직접 누르세요', playing: ` · GD 매크로 재생 중 ${gdSend?.speed ?? 1}x (F9 정지) · 최대 지연 ${gdWorst.toFixed(2)}ms` + (gdSend && gdSend.speed !== 1 ? ' · ⚠ GD도 같은 배속이어야 함' : ''), done: ' · GD 매크로 끝', stopped: ' · GD 매크로 정지' }[gdMacro] ?? '');
}

// Logic (sound scheduling, misses, run end) ticks from a Worker timer, drawing from rAF.
// rAF stops when the page is hidden or covered by GD, and page timers drop to 1/s then;
// dedicated-worker timers keep running, so playback and sounds work behind GD.
const ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 10)'], { type: 'text/javascript' })));
ticker.onmessage = () => { if (run) tick(performance.now()); };

// view switch: rhythm lane needs a taller canvas; remembered per browser
function applyView() {
  lane.style.height = $('view').value === 'rhythm' ? '560px' : '';
  try { localStorage.setItem('gdpt-view', $('view').value); } catch {}
}
try { $('view').value = localStorage.getItem('gdpt-view') || 'gd'; } catch {}
$('view').addEventListener('change', e => { e.target.blur(); applyView(); });
applyView();
function frame(now) {
  draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
